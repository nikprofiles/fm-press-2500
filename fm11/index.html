<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Сборка фундамента</title>
<style>
:root{--bg:#ffffff;--panel:#ffffff;--line:#d9e0e8;--txt:#182230;--mut:#5c6b7a;--acc:#1769e0;--ok:#1f9d55;--warn:#d98a00;--sel:#ff7a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:fixed;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:linear-gradient(var(--bg) 40%,transparent);pointer-events:none;z-index:5}
#top h1{margin:0;font-size:19px;font-weight:700}
#top .sub{color:var(--mut);font-size:13px;margin-top:2px}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding:8px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(20,40,70,.14);transition:transform .25s}
#hud.min{transform:translateY(calc(100% - 66px))}
#grab{width:48px;height:5px;border-radius:3px;background:#c5ced8;margin:0 auto 10px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
button{background:#f2f5f9;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:16px;font-weight:600;cursor:pointer;user-select:none;line-height:1.1}
button:active{background:#e3e9f0}
button.acc{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:8px 11px;font-size:14px;border-radius:9px}
button.on{background:#dcebff;border-color:var(--acc);color:#0b3f7f}
#stageTitle{font-weight:700;font-size:17px;flex:1;min-width:0;line-height:1.2}
#stageNo{color:var(--acc);white-space:nowrap}
#desc{color:#3a4756;font-size:15px;margin:8px 0 0;max-height:6.5em;overflow:auto;line-height:1.4}
#bar{height:8px;background:var(--line);border-radius:4px;margin:10px 0 8px;overflow:hidden}
#bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
#stats{display:flex;gap:16px;color:var(--mut);font-size:14px;flex-wrap:wrap}
#stats b{color:var(--txt);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:15px;margin-top:8px}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
tr.sel td{background:#ffe6cc}
tr.pos{cursor:pointer}
tr.pos:active td{background:#e8eef5}
#tabs{display:flex;gap:4px;margin:10px 0 4px;border-bottom:1px solid var(--line)}
#tabs button{border:0;border-radius:9px 9px 0 0;background:transparent;color:var(--mut);padding:10px 12px;font-size:15px}
#tabs button.on{color:var(--txt);background:#eef2f7}
.pane{max-height:36vh;overflow:auto;-webkit-overflow-scrolling:touch}
#steps{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
#steps::-webkit-scrollbar{display:none}
#steps button{flex:0 0 auto;min-width:42px;padding:9px 11px;font-size:15px}
#steps button.done{border-color:var(--ok);color:var(--ok)}
#steps button.cur{background:var(--acc);border-color:var(--acc);color:#fff}
#steps button.whole{border-color:var(--warn);color:var(--warn)}
#steps button.whole.cur{background:var(--warn);color:#fff}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#fff;box-shadow:0 6px 24px rgba(20,40,70,.18);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:15px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}
#legend{position:fixed;right:12px;top:max(70px,calc(env(safe-area-inset-top) + 62px));z-index:5;display:flex;flex-direction:column;gap:8px}
#legend button{width:48px;height:48px;padding:0;border-radius:14px;font-size:20px}
#speed{position:fixed;left:12px;top:max(70px,calc(env(safe-area-inset-top) + 62px));z-index:5;display:flex;flex-direction:column;gap:6px}
#speed button{width:52px;padding:8px 0;font-size:14px;border-radius:10px}
#banner{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:max(90px,calc(env(safe-area-inset-top) + 80px));z-index:8;pointer-events:none}
#banner>div{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:18px 24px;text-align:center;max-width:88vw;box-shadow:0 12px 40px rgba(20,40,70,.22)}
#banner h2{margin:0 0 8px;font-size:22px;line-height:1.2}
#banner p{margin:0;color:#3a4756;font-size:16px}
#callout{position:fixed;left:12px;right:72px;top:max(70px,calc(env(safe-area-inset-top) + 62px));z-index:7;background:rgba(255,255,255,.97);border:2px solid var(--sel);border-radius:16px;padding:14px 16px;box-shadow:0 10px 36px rgba(0,0,0,.35);max-width:520px}
#callout .h{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
#callout .h .sw{width:16px;height:16px;border-radius:4px}
#callout .g{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px;font-size:15px}
#callout .g b{color:var(--mut);font-weight:600}
#callout .ref{margin-top:10px;padding:10px 12px;background:#fff3e6;border-radius:10px;font-size:15px;line-height:1.35}
#callout .ref a{color:var(--acc);text-decoration:none;font-weight:600}
#callout .x{position:absolute;right:8px;top:8px;width:36px;height:36px;padding:0;border-radius:10px;font-size:18px}
#callout.intro{border-color:var(--warn)}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
#secBtns button.on{background:#ffe6cc;border-color:var(--sel);color:#7a3a00}
#secList table{font-size:13px}#secList td{padding:5px 6px}
#explodeBox{display:flex;align-items:center;gap:10px;margin:6px 0 2px}#explodeBox label{font-size:14px;color:var(--mut);white-space:nowrap}
tr.hdr td{background:#f4f7fa;font-weight:700;color:var(--mut);font-size:13px;text-transform:uppercase}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;background:#eef2f7;color:#3a4756;margin-right:6px;margin-bottom:4px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:8px;vertical-align:middle}
#left{display:none}
#mtabs,#mstrip{display:none}
@media (max-width:899px){
 html,body{font-size:15px}
 #top{padding:max(8px,env(safe-area-inset-top)) 12px 6px}#top h1{font-size:16px}#top .sub{display:none}
 #mtabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px;box-shadow:0 -6px 20px rgba(20,40,70,.12)}
 #mtabs button{flex:1;padding:8px 2px;font-size:12px;border-radius:10px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px}
 #mtabs button i{font-style:normal;font-size:20px}
 #mtabs button.on{background:#dcebff;border-color:var(--acc);color:#0b3f7f}
 #mstrip{display:flex;position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:11;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:6px 8px;gap:6px;align-items:center}
 #mstrip #stageTitle{font-size:14px}
 #mstrip #play{white-space:nowrap}
 #hud{top:auto;bottom:calc(66px + env(safe-area-inset-bottom));max-height:40vh;transform:translateY(110%);transition:transform .25s,max-height .25s;padding:6px 12px 10px;border-radius:18px 18px 0 0;overflow:auto;box-shadow:0 -8px 30px rgba(20,40,70,.2)}
 #hud.open{transform:none}#hud.full{max-height:calc(100vh - 150px)}
 #hud h3,#hud .sub{font-size:13px}#desc{font-size:13px;max-height:4.5em}#stats{font-size:12px;gap:10px}
 #hud button.sm{padding:6px 9px;font-size:13px}#secBtns button{padding:6px 8px}
 #hud table{font-size:12.5px}#hud td,#hud th{padding:5px 5px}#hud th{font-size:11px}
 #hud.min{transform:translateY(110%)}
 #hud>.row:first-of-type,#hud #steps,#hud #tabs{display:none}
 #grab{margin:4px auto 8px}
 .pane{max-height:none}
 #legend{top:max(44px,calc(env(safe-area-inset-top) + 36px));bottom:auto;right:6px;gap:4px}#legend button{width:34px;height:34px;font-size:15px;border-radius:9px;opacity:.85}
 #speed{display:none}
 #callout{top:auto;left:6px;right:6px;bottom:calc(126px + env(safe-area-inset-bottom));max-height:30vh;overflow:auto;padding:6px 36px 6px 9px;border-width:1.5px;border-radius:12px}
 #callout .h{font-size:13px;gap:6px;padding-right:36px;line-height:1.2}#callout .h .sw{width:10px;height:10px}#callout .g{font-size:12px;gap:1px 8px;margin-top:5px}#callout .ref{font-size:12px;padding:5px 8px;margin-top:5px}#callout.mini{padding:5px 36px 5px 9px}#callout.mini .more{font-size:11.5px;margin-top:2px}
 #callout .x{width:26px;height:26px;font-size:13px;right:5px;top:5px}
 #callout.mini .g,#callout.mini .ref{display:none}#callout .more{display:none}#callout.mini .more{display:block;font-size:12px;color:var(--acc);margin-top:4px}
 #mstrip #stageTitle{font-size:13px}#mstrip button.sm{padding:6px 9px;font-size:13px}#steps button{min-width:34px;padding:6px 8px;font-size:13px}
 #tree .n{padding:6px 5px;font-size:13px}#tree .n.leaf{font-size:12.5px;padding-left:24px}#tree .n.g{font-size:11px}#search{font-size:13px;padding:6px 9px}
 #mtabs button{min-height:46px;font-size:11px}#mtabs button i{font-size:17px}
 #toast{font-size:13px;padding:7px 12px}#banner h2{font-size:17px}#banner p{font-size:13px}
 #banner{padding-top:max(60px,calc(env(safe-area-inset-top) + 50px))}
 #toast{top:auto;bottom:calc(136px + env(safe-area-inset-bottom))}
 #tree .n{padding:8px 6px;font-size:15px}#tree .n.leaf{font-size:14px}
 td,th{padding:8px 6px}
 #p-more .row{margin:8px 0}
}
#tree{font-size:14px;line-height:1.25}
#tree .n{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tree .n:hover{background:#eef2f7}
#tree .n.sel{background:#ffe6cc;color:#7a3a00;font-weight:600}
#tree .n .tg{width:16px;flex:0 0 16px;text-align:center;color:var(--mut);font-size:11px}
#tree .n .cnt{margin-left:auto;color:var(--mut);font-size:12px;padding-left:8px}
#tree .n.g{font-weight:700;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.03em;margin-top:6px}
#tree .ch{margin-left:16px}
#tree .n.leaf{padding-left:28px;font-size:13px}
#search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;margin-bottom:8px;background:#fff;color:var(--txt)}
@media (min-width:900px){
 #hud{left:auto;right:0;top:0;bottom:0;width:430px;border-left:1px solid var(--line);border-top:0;border-radius:0;padding:max(12px,env(safe-area-inset-top)) 14px 12px;overflow:auto;box-shadow:-6px 0 24px rgba(20,40,70,.08);transition:none}
 #hud.min{transform:none}#grab{display:none}.pane{max-height:none}
 #left{display:block;position:fixed;left:0;top:0;bottom:0;width:300px;background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;overflow:auto;z-index:6;box-shadow:6px 0 24px rgba(20,40,70,.08)}
 #top{left:300px;right:430px}
 #legend{right:446px}#speed{left:316px}#callout{left:316px;right:auto;max-width:560px}#toast{left:calc(50% - 65px)}#banner{left:300px;right:430px}
 #p-el #explodeBox{margin-top:4px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><h1 id="ttl"></h1><div class="sub" id="code"></div><div class="sub" style="pointer-events:auto"><a href="../" style="color:var(--acc);text-decoration:none">⌂ Выбор фундамента</a> · <a href="../fm10/" style="color:var(--acc);text-decoration:none">→ Фм1.10 (2500 т)</a></div></div>
<div id="left"><input id="search" placeholder="Поиск элемента…"><div id="treeHost"></div></div>
<div id="speed"><button class="sm" data-sp="0.5">×0,5</button><button class="sm" data-sp="1">×1</button><button class="sm" data-sp="2">×2</button><button class="sm" data-sp="4">×4</button></div>
<div id="callout" hidden><button class="x" id="coX">✕</button><div class="h"><span class="sw" id="coSw"></span><span id="coT"></span></div><div class="g" id="coG"></div><div class="ref" id="coRef"></div></div>
<div id="legend">
  <button id="bHome" title="Вид">⌂</button>
  <button id="bWhole" title="Весь фундамент в сборе">◼</button>
  <button id="bConc" title="Бетон: сплошной / прозрачный / скрыть">▣</button>
  <button id="bForm" title="Опалубка">▤</button>
  <button id="bCut" title="Разрез">✂</button>
  <button id="bPrev" title="Предыдущие этапы: видны / прозрачно / скрыть">◐</button>
</div>
<div id="mstrip"><button id="mprev" class="sm">◀</button><div id="stageTitle"><span id="stageNo"></span> <span id="stageT"></span></div><button id="mnext" class="sm">▶</button><button id="mplay" class="sm acc">▶</button></div>
<div id="mtabs"><button data-m="stage"><i>⟲</i>Этапы</button><button data-m="el"><i>☰</i>Элементы</button><button data-m="cut"><i>✂</i>Разрез</button><button data-m="spec"><i>▤</i>Спец.</button><button data-m="more"><i>⋯</i>Ещё</button></div>
<div id="banner" hidden><div><h2 id="bnH"></h2><p id="bnP"></p></div></div>
<div id="toast"></div>
<div id="hud">
  <div id="grab"></div>
  <div class="row">
    <button id="prev" class="sm">◀</button>
    <div id="stageTitle"><span id="stageNo"></span> <span id="stageT"></span></div>
    <button id="next" class="sm">▶</button>
    <button id="play" class="sm acc">▶ Сборка</button>
  </div>
  <div id="steps"></div>
  <div id="bar"><i></i></div>
  <div id="stats"></div>
  <div id="tabs"><button class="on" data-t="stage">Этап</button><button data-t="spec">Спецификация</button><button data-t="el">Элементы</button><button data-t="conc">Бетон/опалубка</button><button data-t="cut">Разрез</button></div>
  <div class="pane" id="p-stage"><div id="desc"></div><table id="tstage"></table></div>
  <div class="pane" id="p-spec" hidden><table id="tspec"></table></div>
  <div class="pane" id="p-el" hidden><div id="explodeBox"><label>Разнести</label><input type="range" id="explode" min="0" max="1000" value="0"></div><div id="tree"></div></div>
  <div class="pane" id="p-conc" hidden><table id="tconc"></table></div>
  <div class="pane" id="p-more" hidden><div class="row wrap" id="moreSpeed"></div><div class="row wrap" id="moreView"></div><table id="tconc2"></table></div>
  <div class="pane" id="p-cut" hidden>
    <div class="sub" style="color:var(--mut);font-size:13px;margin:6px 0 4px">Разрезы по чертежу (лист 26, план <span id="secPlan"></span>):</div>
    <div class="row wrap" id="secBtns" style="margin:0 0 8px"></div>
    <div class="row wrap" style="margin:6px 0"><button class="sm" data-cut="none">Нет</button><button class="sm" data-cut="x">⟂X</button><button class="sm" data-cut="y">⟂Y</button><button class="sm" data-cut="z">⟂Z</button><button class="sm" id="cutFlip" title="Сменить сторону">⇄ сторона</button></div>
    <input type="range" id="cutR" min="0" max="1000" value="500"><div class="sub" id="cutV" style="color:var(--mut);font-size:12px"></div>
    <div class="row" style="margin:8px 0 4px"><label style="font-size:14px;display:flex;gap:8px;align-items:center"><input type="checkbox" id="markSec"> Отмечать элементы, попавшие в разрез (±<span id="tolV">120</span> мм)</label></div>
    <input type="range" id="tolR" min="20" max="500" value="120" style="height:22px">
    <div id="secList"></div>
  </div>
</div>

$('#markSec').onchange=e=>{state.markSec=e.target.checked;markSection();};
$('#tolR').oninput=e=>{state.tol=+e.target.value;$('#tolV').textContent=state.tol;markSection();};
function updateCutLabel(){document.querySelectorAll('[data-sec]').forEach(x=>x.classList.toggle('on',x.dataset.sec===state.section));if(state.cut==='none'){$('#cutV').textContent='Разрез выключен';return;}const v=cutPos();$('#cutV').textContent=`${state.section?'Разрез '+state.section+' · ':''}плоскость ⟂${state.cut.toUpperCase()}: ${state.cut==='z'?'отм. '+(v/1000).toFixed(3):fmt(v)+' мм от угла ступени'} · удалена сторона ${state.cutSign>0?'+':'−'}${state.cut.toUpperCase()} · режет бетон, арматуру и закладные`;}
// ---------- пошаговая сборка ----------
let animId=null,speed=0.5;
document.querySelectorAll('#speed button').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;document.querySelectorAll('#speed button').forEach(x=>x.classList.toggle('on',x===b));toast('Скорость сборки ×'+speed);});
document.querySelector('#speed button[data-sp="0.5"]').classList.add('on');
function stopAnim(){if(animId){cancelAnimationFrame(animId);animId=null;}if(camAnim){cancelAnimationFrame(camAnim);camAnim=null;}$('#banner').hidden=true;$('#play').textContent='▶ Сборка';if(state.anim){state.anim=null;state.sel.clear();hideCallout();state.progress=1;rebuildAll();}}
function banner(h,p,ms){return new Promise(r=>{$('#bnH').textContent=h;$('#bnP').textContent=p;$('#banner').hidden=false;setTimeout(()=>{$('#banner').hidden=true;r();},ms/speed);});}
function wait(ms){return new Promise(r=>setTimeout(r,ms/speed));}
async function playFrom(n){if(state.anim){stopAnim();return;}state.anim=true;$('#play').textContent='■ Стоп';
 for(let s=n;s<=stages.length&&state.anim;s++){const st=stages[s-1];const l=liftById[st.lift];
  state.whole=false;state.stage=s;state.progress=0;state.pourLevel=null;state.formLift=null;state.sel.clear();rebuildAll();
  const first=s===1||stages[s-2].lift!==st.lift;
  if(first){await banner(l.name,`Отм. ${(l.z0/1000).toFixed(3)} … ${(l.z1/1000).toFixed(3)} · бетон ${l.cls} ${l.V} м³`,1600);if(!state.anim)return;}
  await banner(`Этап ${st.id}. ${st.title}`,`${st.bars.length} шт · ${fmt(massOf(st.bars))} кг`,1400);if(!state.anim)return;
  // знакомство с элементами этапа: по каждой позиции — приближение, карточка, где на чертеже
  const posList=[...new Set(st.bars.map(i=>bars[i].pos))];
  for(const p of posList){if(!state.anim)return;state.sel.clear();state.sel.add(p);state.progress=1;rebuildAll();showCallout(p,true);
   const ids=st.bars.filter(i=>bars[i].pos===p);await frameIds(ids,{pitch:0.5,dur:700});await wait(1900);}
  // закладные этой захватки, устанавливаемые до бетонирования

  state.sel.clear();hideCallout();state.progress=0;rebuildAll();
  await flyTo([C[0],C[1],Math.max(C[2]-500,l.z0+600)],{yaw:-2.2,pitch:0.55,dist:14000,dur:700});if(!state.anim)return;
  const N=st.bars.length;const dur=Math.min(4000,Math.max(1200,N*18));const t0=performance.now();
  await new Promise(res=>{const tick=()=>{if(!state.anim)return res();const t=(performance.now()-t0)*speed/dur;state.progress=Math.min(1,t);rebuildBars();invalidate();if(t<1)animId=requestAnimationFrame(tick);else res();};tick();});
  if(!state.anim)return;state.progress=1;rebuildBars();invalidate();await wait(500);
  const last=s===stages.length||stages[s].lift!==st.lift;
  if(last){// опалубка
   state.formLift=l.id;rebuildForm();invalidate();await banner('Монтаж опалубки',`${l.name}: борт ${fmt(l.z1-l.z0)} мм, ${l.area} м² щитов, верх опалубки ${(l.z1/1000).toFixed(3)}`,1800);if(!state.anim)return;
   await banner('Приёмка армирования',`Проверка защитного слоя, фиксаторов, закладных. Бетон ${l.cls}: ${l.V} м³`,1400);if(!state.anim)return;
   const t1=performance.now();const pd=2200;await new Promise(res=>{const tick=()=>{if(!state.anim)return res();const t=Math.min(1,(performance.now()-t1)*speed/pd);state.pourLevel={lift:l.id,z:l.z0+(l.z1-l.z0)*t};rebuildConc();invalidate();$('#bnH').textContent='Бетонирование';$('#bnP').textContent=`${fmt(l.V*t,1)} / ${l.V} м³ · уровень ${((l.z0+(l.z1-l.z0)*t)/1000).toFixed(3)}`;$('#banner').hidden=false;if(t<1)animId=requestAnimationFrame(tick);else res();};tick();});
   $('#banner').hidden=true;if(!state.anim)return;
   await banner('Уход за бетоном',`Рабочий шов на отм. ${(l.z1/1000).toFixed(3)}${l.id!==LAST?' — поверхность шва обработать перед следующей захваткой':' — фундамент готов'}`,1500);if(!state.anim)return;
   state.pourLevel=null;state.formLift=null;}
 }
 if(state.anim){state.whole=true;rebuildAll();await banner((DATA.short||'Фундамент')+' собран',`${fmt(DATA.totals.rebar_kg)} кг арматуры · ${DATA.totals.concrete_B25} м³ бетона B25`,2500);}
 stopAnim();}
$('#play').onclick=()=>{if(PHONE)msheet(null);playFrom(state.whole?1:state.stage);};
// ---------- мобильная компоновка ----------
let msheetCur=null;
function msheet(m){msheetCur=m;if(m)$('#callout').classList.add('mini');setTimeout(invalidate,30);setTimeout(invalidate,300);document.querySelectorAll('#mtabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 if(!m){$('#hud').classList.remove('open');return;}
 ['stage','spec','el','conc','cut','more'].forEach(t=>{const p=$('#p-'+t);if(p)p.hidden=t!==m;});$('#hud').classList.add('open');$('#hud').scrollTop=0;}
if(PHONE){
 // лента этапов и кнопки управления — в нижнюю полоску
 const strip=$('#mstrip');const hudTitle=$('#hud #stageTitle');strip.replaceChild(hudTitle,$('#mstrip #stageTitle'));
 $('#mprev').onclick=()=>$('#prev').click();$('#mnext').onclick=()=>$('#next').click();$('#mplay').onclick=()=>{msheet(null);playFrom(state.whole?1:state.stage);};
 $('#play').parentElement.style.display='none';strip.appendChild($('#steps'));$('#steps').style.cssText='flex:1 1 100%;order:5;margin-top:4px';strip.style.flexWrap='wrap';
 // «Ещё»: скорость, вид, бетон/опалубка
 $('#moreSpeed').appendChild($('#speed'));$('#speed').style.cssText='display:flex;position:static;flex-direction:row;gap:6px';
 $('#moreView').innerHTML='<button class="sm" id="mHome">⌂ Вид</button><button class="sm" id="mWhole">◼ Весь фундамент</button><button class="sm" id="mConc">▣ Бетон</button><button class="sm" id="mForm">▤ Опалубка</button><button class="sm" id="mPrev">◐ Пред. этапы</button>';
 $('#mHome').onclick=()=>$('#bHome').click();$('#mWhole').onclick=()=>{$('#bWhole').click();msheet(null);};$('#mConc').onclick=()=>$('#bConc').click();$('#mForm').onclick=()=>$('#bForm').click();$('#mPrev').onclick=()=>$('#bPrev').click();
 $('#p-more').appendChild($('#tconc'));
 document.querySelectorAll('#mtabs button').forEach(b=>b.onclick=()=>{msheet(msheetCur===b.dataset.m?null:b.dataset.m);});placeOverlays();window.addEventListener('resize',()=>{placeOverlays();invalidate();});
 $('#grab').onclick=()=>$('#hud').classList.toggle('full');
 $('#hud').addEventListener('pointerup',e=>{if(gy!==null){const d=e.clientY-gy;if(d>50)msheet(null);else if(d<-50)$('#hud').classList.add('full');gy=null;}},true);
 // стрелки этапов: при смене этапа обновлять полоску (renderHUD пишет в #stageTitle, он перенесён)
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')stopAnim();if(e.key==='ArrowRight'){stopAnim();setStage(state.stage+1);}if(e.key==='ArrowLeft'){stopAnim();setStage(state.stage-1);}});
// ---------- старт ----------
$('#ttl').textContent=DATA.title;$('#code').textContent=DATA.code+(DATA.source?' · '+DATA.source:'');
rebuildEmb();renderSpec();renderConc();renderEl();updateCutLabel();if(innerWidth>=900){$('#explodeBox').style.margin='6px 0';$('#p-el').insertAdjacentHTML('beforeend','<div class="sub" style="color:var(--mut);font-size:13px">Список элементов — в левой колонке. Shift+клик — добавить к выбору, клик по пустому месту — снять выбор.</div>');}$('#bForm').classList.add('on');
// стартовый этап из hash: #s5 или #all
if(innerWidth<innerHeight){cam.dist=24000;cam.tgt=[C[0],C[1],C[2]-1200];}const h=location.hash;if(h==='#all'){showWhole();}else{const m=/#s(\d+)/.exec(h);setStage(m?+m[1]:1);}
loop();
</script>
</body>
</html>
